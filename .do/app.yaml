# DigitalOcean App Platform spec.
# Deploy with: doctl apps create --spec .do/app.yaml
# (update `github.repo` / `branch` if you deploy from a fork)
name: gif-overlay
services:
  - name: web
    github:
      repo: elearningdifferently/gif-overlay
      branch: main
      deploy_on_push: true
    environment_slug: python
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
    envs:
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_BATCH_UPLOAD_MB
        value: "1024"
      - key: MAX_FILE_MB
        value: "100"
      - key: MAX_PIXELS
        value: "950000000"
